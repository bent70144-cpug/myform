# Alpha deploy pipeline (tickets 02 + 12 — spec "Deployment and configuration").
#
# Order is load-bearing: migrations run FIRST (as the `migrator`, from a GitHub
# Actions secret), and only then is the Render deploy hook triggered. Render
# auto-deploy on push MUST be disabled in the Render dashboard (Settings →
# Build & Deploy → Auto-Deploy: off) so new code cannot start before the schema
# exists.
#
# Render free tier has NO pre-deploy migration command — migrations never run
# as a Render pre-deploy step; GitHub Actions migration-before-deploy is the
# primary path.
#
# Required secrets (set in the GitHub repository settings, never in Render):
#   MIGRATOR_DATABASE_URL   direct Neon URL for the `migrator` role
#                           (Neon: pooled URL with ?pgbouncer=true is NOT used
#                           here — migrations and pg-boss use the DIRECT URL)
#   RENDER_API_KEY          Render API key (workspace: Ben's workspace)
#   RENDER_SERVICE_ID       id of the myform-api Render service (srv-…);
#                           the deploy hook URL cannot be created via API, so
#                           deploys are triggered through POST /v1/services/
#                           {id}/deploys with the API key instead
#
# Jobs:
#   migrate      (main only)      apply migrations as the `migrator` role
#   deploy       (main only)      trigger a Render deploy AFTER migrate
#   smoke-local  (main + integration/m0)  the LOCAL alpha smoke on a fresh
#                runner: embedded Postgres + supervisor + the full
#                health → signup → verify → workspace → form → draft →
#                publish → submit → receipt loop over HTTP
#                (scripts/smoke-alpha.mjs). This proves the walking skeleton
#                end-to-end in CI on every integration push.
#
# The RENDER smoke (signup → publish → submit → review on the live alpha URL)
# is MANUAL — it needs real email delivery and the deployed origin; run the
# checklist in docs/RUNBOOK-deploy.md after each live deploy.
name: deploy

on:
  push:
    branches: [main, integration/m0]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  migrate:
    name: Run migrations (migrator role)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The migrate CLI imports @form/config, which resolves to its built dist
      # on the runner — build the workspace first (a fresh runner has no dist).
      - name: Build workspace packages
        run: pnpm build

      # The migrator URL exists ONLY here (GitHub secret) — it never appears in
      # Render's runtime environment.
      - name: Apply migrations as the migrator
        run: pnpm db:migrate
        env:
          MIGRATOR_DATABASE_URL: ${{ secrets.MIGRATOR_DATABASE_URL }}

      # The `auth` schema (Better Auth generated DDL) and the `pgboss` schema
      # are NOT owned by SQL migrations (ADR 0003): the request path's schema
      # is Better Auth's own migration runner, pg-boss's is its installer.
      # Both are idempotent and run right after the SQL migrations, as the
      # admin. Their secrets are Actions-only (never Render, never the repo).
      - name: Apply auth-schema DDL (Better Auth)
        run: pnpm --filter @form/api exec tsx src/scripts/ensure-auth-tables.ts
        env:
          ADMIN_DATABASE_URL: ${{ secrets.ADMIN_DATABASE_URL }}

      - name: Install pgboss schema + worker_user grants
        run: pnpm --filter @form/worker exec tsx src/install-pgboss.ts
        env:
          ADMIN_DATABASE_URL: ${{ secrets.ADMIN_DATABASE_URL }}
          MIGRATOR_DATABASE_URL: ${{ secrets.MIGRATOR_DATABASE_URL }}
          WORKER_PASSWORD: ${{ secrets.WORKER_PASSWORD }}

  deploy:
    name: Trigger Render deploy (API)
    if: github.ref == 'refs/heads/main'
    needs: migrate
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          if [ -z "$RENDER_SERVICE_ID" ]; then
            echo "RENDER_SERVICE_ID is not set — the Render service does not
            exist yet (workspace billing). Migrations ran; skipping the deploy
            trigger. Set the service id secret once the service is created."
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -d '{"clearCache":"do_not_clear"}' \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys"
          echo
          echo "Render deploy triggered after successful migrations."

      # The live RENDER smoke stays MANUAL (needs real email + the deployed
      # origin): follow docs/RUNBOOK-deploy.md "Live smoke checklist" after the
      # deploy finishes. The automated smoke is smoke-local below.

  smoke-local:
    name: Local alpha smoke (walking skeleton)
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/integration/m0'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: smoke-local-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Boots embedded Postgres + the supervisor stack (web/api/worker/sink)
      # and drives the real loop over HTTP; exits non-zero on any failure.
      - name: Run the local alpha smoke
        run: pnpm smoke:alpha
